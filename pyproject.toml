[project]
name = "auralytica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sakanaowo", email = "idiotbugg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
    "yt-dlp[default]>=2026.8.19",
    "ytmusicapi==1.12.2",
]

[project.scripts]
auralytica = "auralytica:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
browser = [
    "playwright>=1.62.0",
]
notebook = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
]
test = [
    "httpx>=0.28.1",
]
